kind: Service
apiVersion: v1
metadata:
  name: 07-search-http-verb
  labels:
    app: 07-search-http-verb
spec:
  type: ClusterIP
  selector:
    app: 07-search-http-verb
  ports:
    - name: tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: 07-search-http-verb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 07-search-http-verb
  template:
    metadata:
      labels:
        app: 07-search-http-verb
        version: v1
    spec:
      containers:
      - name: 07-search-http-verb
        image: 07-search-http-verb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
